[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshmind"
version = "0.1.0"
description = "MeshMind — own neural network for 2D/3D modelling: text- and image-conditioned mesh generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "reaktor514" }]
keywords = ["neural-network", "3d", "generative", "diffusion", "mesh", "gradio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.27.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "trimesh>=4.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0,<2.0.0",
    "gradio>=4.20.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[project.scripts]
meshmind-app = "meshmind.cli:launch_app"

[tool.setuptools.packages.find]
include = ["meshmind*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
